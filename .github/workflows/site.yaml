name: Site
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'site/**'
  release:
    types:
      - published
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-website:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: sbt/setup-sbt@v1
      - uses: coursier/cache-action@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          check-latest: true
      - name: Compile
        run: sbt compile
      - name: Generate site
        run: make build-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  publish-website:
    needs: build-website
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4